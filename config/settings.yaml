validation_bounds:
  collection_interval_seconds:
    min: 1
    max: 60
  metrics_interval_seconds:
    min: 1
    max: 30
  container_detail_stats_interval_seconds:
    min: 1
    max: 10
  host_metrics_interval_seconds:
    min: 1
    max: 30
  log_tail_default:
    min: 10
    max: 1000
  retention_days:
    min: 1
    max: 365
  events_retention_days:
    min: 1
    max: 365
  audit_retention_days:
    min: 7
    max: 365
  terminal_transcript_retention_days:
    min: 1
    max: 365
  alert_eval_interval_seconds:
    min: 5
    max: 300
  alert_default_cooldown_minutes:
    min: 1
    max: 1440
  max_login_attempts:
    min: 3
    max: 20
  lockout_duration_minutes:
    min: 1
    max: 60

retention_config:
  metrics_rollup_age_hours: 24
  retention_cron_hour: 3
  retention_cron_minute: 0

feature_flags:
  terminal_enabled: false
  metrics_collection_enabled: true
  auto_prune_enabled: false
  registration_enabled: false
