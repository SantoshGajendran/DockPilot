app_name: "DockPilot"
environment: "development"
host: "127.0.0.1"
port: 8000
database_url: "postgresql+asyncpg://dockpilot:dockpilot@127.0.0.1:5432/dockpilot"
docker_host: "tcp://127.0.0.1:2375"
cors_origins:
  - "http://localhost:4200"
  - "http://127.0.0.1:4200"
collection_interval_seconds: 5
retention_days: 30
log_tail_default: 200
log_search_max_bytes_scanned: 10485760
log_stream_buffer_max_lines: 1000
log_backpressure_drop_threshold: 500
metrics_interval_seconds: 3
top_containers_limit: 5
recent_events_limit: 10
stale_threshold_multiplier: 2.0
jwt_secret: "dev-secret-key-change-in-production-min-32-chars-long"
jwt_access_expire_minutes: 15
jwt_refresh_expire_days: 7
max_login_attempts: 5
lockout_duration_minutes: 15
default_admin_user: "admin"
default_admin_password: "dockpilot_admin_2026"
auth_cookie_path: "/"
containers_page_size_default: 20
containers_page_size_max: 100
delete_token_expire_seconds: 60
containers_stream_interval_seconds: 3
secret_mask_patterns:
  - "*PASSWORD*"
  - "*SECRET*"
  - "*TOKEN*"
  - "*KEY*"
  - "*AUTH*"
  - "*CREDENTIAL*"
  - "*PRIVATE*"
container_detail_stats_interval_seconds: 2
host_metrics_interval_seconds: 3
host_top_processes_count: 10
host_cpu_warning_threshold: 80.0
host_cpu_critical_threshold: 90.0
host_memory_warning_threshold: 80.0
host_memory_critical_threshold: 90.0
host_disk_warning_threshold: 80.0
host_disk_critical_threshold: 90.0
compose_project_allow_paths:
  - "/opt/stacks"
  - "/home/ubuntu/dockpilot"
  - "/var/dockpilot/compose"
  - "c:/Santosh/Development/dockpilot"
  - "."
compose_project_paths:
  dockpilot: "."
  web: "/opt/stacks/web"
  worker: "/opt/stacks/worker"
  cache: "/opt/stacks/cache"
compose_job_timeout_seconds: 300

