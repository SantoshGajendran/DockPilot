app_name: "DockPilot"
environment: "development"
host: "127.0.0.1"
port: 8000
database_url: "postgresql+asyncpg://dockpilot:dockpilot@127.0.0.1:5432/dockpilot"
docker_host: "tcp://127.0.0.1:2375"
cors_origins:
  - "http://localhost:4200"
  - "http://127.0.0.1:4200"
collection_interval_seconds: 5
retention_days: 30
log_tail_default: 200
metrics_interval_seconds: 3
top_containers_limit: 5
recent_events_limit: 10
stale_threshold_multiplier: 2.0
jwt_secret: "dev-secret-key-change-in-production-min-32-chars-long"
jwt_access_expire_minutes: 15
jwt_refresh_expire_days: 7
max_login_attempts: 5
lockout_duration_minutes: 15
default_admin_user: "admin"
default_admin_password: "dockpilot_admin_2026"
auth_cookie_path: "/"
containers_page_size_default: 20
containers_page_size_max: 100
delete_token_expire_seconds: 60
containers_stream_interval_seconds: 3
