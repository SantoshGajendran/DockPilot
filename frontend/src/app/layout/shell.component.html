<mat-sidenav-container class="shell-container">
  <mat-sidenav mode="side" opened [class.collapsed]="isCollapsed()" class="shell-sidenav glass-panel">
    <div class="sidebar-header">
      <div class="brand-group" *ngIf="!isCollapsed()">
        <span class="brand-mark">⬡</span>
        <span class="app-title">DockPilot</span>
      </div>
      <button mat-icon-button (click)="toggleSidebar()" class="collapse-btn" aria-label="Toggle sidebar">
        <dp-icon [name]="isCollapsed() ? 'chevron-right' : 'chevron-left'" [size]="16"></dp-icon>
      </button>
    </div>

    <div class="sidebar-scroll">
      <nav class="nav-sections">
        <div class="nav-group" *ngFor="let section of navSections">
          <div class="group-header micro-label" *ngIf="!isCollapsed()">
            {{ section.label }}
          </div>
          <div class="group-items">
            <ng-container *ngFor="let item of getItemsForGroup(section.group)">
              <a
                *ngIf="canAccess(item)"
                [routerLink]="item.path"
                routerLinkActive="active-link"
                class="nav-item"
                [matTooltip]="isCollapsed() ? item.label : ''"
                matTooltipPosition="right"
              >
                <span class="active-indicator"></span>
                <dp-icon [name]="item.strokeIcon || item.icon" [size]="18" class="nav-icon"></dp-icon>
                <span class="nav-label" *ngIf="!isCollapsed()">{{ item.label }}</span>
                <span class="nav-shortcut micro-label" *ngIf="!isCollapsed() && item.shortcut">
                  {{ item.shortcut }}
                </span>
              </a>
            </ng-container>
          </div>
        </div>
      </nav>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <mat-toolbar class="shell-toolbar glass-panel">
      <!-- Left Navigation Pod: Breadcrumbs & Command Palette Trigger -->
      <div class="nav-pod">
        <!-- Breadcrumbs -->
        <div class="breadcrumb-container">
          <span class="breadcrumb-mark">⬡</span>
          <span class="breadcrumb-text">{{ currentBreadcrumb() }}</span>
        </div>

        <!-- Global Search Command Palette Trigger -->
        <button
          type="button"
          class="cmd-trigger-btn"
          (click)="openCommandPalette()"
          aria-label="Open command palette"
        >
          <dp-icon name="search" [size]="15" class="cmd-search-icon"></dp-icon>
          <span class="cmd-trigger-label">Search fleet or protocols...</span>
          <kbd class="cmd-kbd">Ctrl K</kbd>
        </button>
      </div>

      <span class="spacer"></span>

      <!-- Unified Flight Deck Console Dock -->
      <div class="flight-deck-dock">
        <!-- Live Connection Indicator -->
        <div
          class="connection-cluster"
          [class.is-connected]="sseService.connectionState() === 'connected'"
          matTooltip="Fleet SSE Telemetry Stream"
        >
          <span
            class="pulse-dot"
            [class.connected]="sseService.connectionState() === 'connected'"
            [class.reconnecting]="sseService.connectionState() === 'reconnecting'"
            [class.disconnected]="sseService.connectionState() === 'disconnected'"
          ></span>
          <mat-chip-set class="status-chip-set">
            <mat-chip [ngClass]="'status-' + sseService.connectionState()">
              {{ sseService.connectionState() }}
            </mat-chip>
          </mat-chip-set>
        </div>

        <div class="dock-divider" aria-hidden="true"></div>

        <!-- Precision Action Controls -->
        <div class="action-dock">
          <!-- Alerts Bell -->
          <button
            mat-icon-button
            routerLink="/alerts"
            matTooltip="Active Alerts & Warnings"
            class="alerts-bell-btn action-dock-btn"
            aria-label="View alerts"
          >
            <dp-icon name="bell" [size]="16"></dp-icon>
            <span
              class="alert-badge-count"
              *ngIf="activeAlertsCount() > 0"
              [attr.data-count]="activeAlertsCount()"
            >
              {{ activeAlertsCount() }}
            </span>
          </button>

          <!-- Keyboard Shortcuts Trigger -->
          <button
            mat-icon-button
            (click)="openShortcuts()"
            matTooltip="Keyboard Shortcuts (?)"
            class="shortcuts-btn action-dock-btn"
            aria-label="View keyboard shortcuts"
          >
            <span class="shortcuts-question">?</span>
          </button>

          <!-- Theme Selector Menu Button -->
          <button
            mat-icon-button
            [matMenuTriggerFor]="themeMenu"
            matTooltip="Select Theme"
            class="theme-toggle-btn action-dock-btn"
            aria-label="Theme mode selector"
          >
            <dp-icon [name]="themeService.activeTheme() === 'dark' ? 'moon' : 'sun'" [size]="16"></dp-icon>
          </button>
        </div>

        <div class="dock-divider" aria-hidden="true" *ngIf="authService.currentUser()"></div>

        <!-- User Profile Link -->
        <a
          routerLink="/profile"
          matTooltip="User Profile & Security"
          class="user-info-btn"
          *ngIf="authService.currentUser() as user"
        >
          <span class="user-avatar-badge">
            <dp-icon name="account" [size]="13" class="profile-icon"></dp-icon>
          </span>
          <span class="user-name">{{ user.username }}</span>
          <span class="user-role">[{{ user.role }}]</span>
        </a>
      </div>

      <mat-menu #themeMenu="matMenu" class="theme-menu-panel">
        <button mat-menu-item (click)="themeService.setMode('system')">
          <dp-icon name="monitor" [size]="16" class="menu-icon"></dp-icon>
          <span>System Default</span>
          <dp-icon name="check" [size]="16" class="check-icon" *ngIf="themeService.mode() === 'system'"></dp-icon>
        </button>
        <button mat-menu-item (click)="themeService.setMode('dark')">
          <dp-icon name="moon" [size]="16" class="menu-icon"></dp-icon>
          <span>Dark Mode (Obsidian)</span>
          <dp-icon name="check" [size]="16" class="check-icon" *ngIf="themeService.mode() === 'dark'"></dp-icon>
        </button>
        <button mat-menu-item (click)="themeService.setMode('light')">
          <dp-icon name="sun" [size]="16" class="menu-icon"></dp-icon>
          <span>Light Mode</span>
          <dp-icon name="check" [size]="16" class="check-icon" *ngIf="themeService.mode() === 'light'"></dp-icon>
        </button>
      </mat-menu>
    </mat-toolbar>

    <!-- Main Content Body -->
    <main class="main-body">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

<!-- Shell Modal Overlays -->
<dp-command-palette #commandPalette></dp-command-palette>
<dp-shortcuts-overlay #shortcutsOverlay></dp-shortcuts-overlay>
