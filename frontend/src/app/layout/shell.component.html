<mat-sidenav-container class="shell-container">
  <mat-sidenav mode="side" opened [class.collapsed]="isCollapsed()" class="shell-sidenav">
    <div class="sidebar-header">
      <span class="app-title" *ngIf="!isCollapsed()">DockPilot</span>
      <button mat-icon-button (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <mat-icon>{{ isCollapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
      </button>
    </div>
    <mat-nav-list>
      <ng-container *ngFor="let item of navItems">
        <a mat-list-item *ngIf="canAccess(item)" [routerLink]="item.path" routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle *ngIf="!isCollapsed()">{{ item.label }}</span>
        </a>
      </ng-container>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <mat-toolbar class="shell-toolbar">
      <span class="toolbar-title">DockPilot</span>
      <span class="spacer"></span>
      <button
        mat-icon-button
        routerLink="/alerts"
        matTooltip="Alerts"
        class="alerts-bell-btn"
        aria-label="View alerts"
      >
        <mat-icon
          [matBadge]="activeAlertsCount()"
          [matBadgeHidden]="activeAlertsCount() === 0"
          matBadgeColor="warn"
          matBadgeSize="small"
        >
          notifications
        </mat-icon>
      </button>
      <mat-chip-set>
        <mat-chip [ngClass]="'status-' + sseService.connectionState()">
          {{ sseService.connectionState() }}
        </mat-chip>
      </mat-chip-set>
      <div class="user-info" *ngIf="authService.currentUser() as user">
        <span class="user-name">{{ user.username }}</span>
        <span class="user-role">({{ user.role }})</span>
      </div>
    </mat-toolbar>
    <main class="main-body">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
