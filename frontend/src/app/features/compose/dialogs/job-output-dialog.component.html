<div class="job-dialog">
  <div class="dialog-header">
    <div class="title-group">
      <mat-icon class="terminal-icon">terminal</mat-icon>
      <div>
        <h3>Compose: {{ data.projectName }}</h3>
        <span class="action-tag">{{ data.action | uppercase }}</span>
      </div>
    </div>
    <div class="status-indicator" [ngClass]="status()">
      <mat-spinner *ngIf="status() === 'running' || status() === 'pending'" diameter="16"></mat-spinner>
      <mat-icon *ngIf="status() === 'completed'">check_circle</mat-icon>
      <mat-icon *ngIf="status() === 'failed'">error</mat-icon>
      <span>{{ status() | uppercase }}</span>
      <span *ngIf="exitCode() !== null" class="exit-code">(exit {{ exitCode() }})</span>
    </div>
  </div>

  <div class="terminal-window" #terminalBody (scroll)="onScroll()">
    <div *ngIf="lines().length === 0" class="terminal-empty">
      <span>Initializing compose subprocess...</span>
    </div>
    <div *ngFor="let line of lines()" class="terminal-line">
      {{ line }}
    </div>
  </div>

  <div class="dialog-actions">
    <span class="line-count">{{ lines().length }} lines output</span>
    <button mat-flat-button color="primary" (click)="close()">
      {{ status() === 'running' ? 'Run in Background' : 'Close' }}
    </button>
  </div>
</div>
