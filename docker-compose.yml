services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: dockpilot-socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - VOLUMES=1
      - NETWORKS=1
      - EXEC=1
      - INFO=1
      - EVENTS=1
      - PING=1
      - VERSION=1
      - POST=1
      - DELETE=1
      - SYSTEM=1
    networks:
      - dockpilot-net

  postgres:
    image: postgres:16-alpine
    container_name: dockpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dockpilot
      POSTGRES_PASSWORD: dockpilot_secure_password
      POSTGRES_DB: dockpilot
    volumes:
      - dockpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockpilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dockpilot-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dockpilot-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://dockpilot:dockpilot_secure_password@postgres:5432/dockpilot
      - DOCKER_HOST=tcp://socket-proxy:2375
      - TERMINAL_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    networks:
      - dockpilot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dockpilot-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - dockpilot-net

volumes:
  dockpilot_pgdata:

networks:
  dockpilot-net:
    driver: bridge
