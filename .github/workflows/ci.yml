name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-test-audit:
    name: Backend Tests & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit pytest-cov

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip-audit --desc on

      - name: Run pytest with coverage
        run: |
          cd backend
          pytest --cov=app --cov-report=xml tests/ -q

  frontend-test-audit:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Dependency vulnerability audit (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build production bundle
        run: |
          cd frontend
          npm run build -- --configuration production

  container-security:
    name: Container Security Scanning (Trivy)
    runs-on: ubuntu-latest
    needs: [backend-test-audit, frontend-test-audit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build -t dockpilot-backend:local ./backend

      - name: Scan backend container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "dockpilot-backend:local"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Build frontend image
        run: |
          docker build -t dockpilot-frontend:local ./frontend

      - name: Scan frontend container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "dockpilot-frontend:local"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
